<div class="page">
  <app-page-header
    icon="dashboard"
    [title]="'adminDashboard.title' | translate"
    [subtitle]="'adminDashboard.subtitle' | translate"
  />

  <!-- Metrics -->
  @switch (state()) {
    @case ("loading") {
      <app-loading-state variant="grid" [count]="3" />
    }

    @case ("error") {
      <app-error-state
        [title]="'adminStatistics.noData' | translate"
        [retryLabel]="'common.retry' | translate"
        (retry)="load()"
      />
    }

    @default {
      @if (cart(); as metrics) {
        <div class="dash__stats">
          <app-stat-card
            icon="receipt_long"
            tone="brand"
            [label]="'adminStatistics.averageCart.totalOrders' | translate"
            [value]="metrics.totalOrders"
            [link]="'/admin/statistics'"
          />
          <app-stat-card
            icon="payments"
            tone="success"
            [label]="'adminStatistics.averageCart.totalRevenue' | translate"
            [value]="metrics.totalRevenue | price"
            [link]="'/admin/statistics'"
          />
          <app-stat-card
            icon="shopping_cart"
            tone="info"
            [label]="'adminStatistics.averageCart.averageValue' | translate"
            [value]="metrics.averageCartValue | price"
            [link]="'/admin/statistics'"
          />
          <app-stat-card
            icon="group"
            tone="warning"
            [label]="'adminStatistics.ordersByUser.title' | translate"
            [value]="customerCount()"
            [link]="'/admin/statistics'"
          />
        </div>
      }
    }
  }

  <!-- Quick access -->
  <div class="dash__tiles">
    @for (tile of tiles; track tile.route) {
      <a class="dash__tile surface surface--interactive" [routerLink]="tile.route">
        <span class="dash__tile-icon">
          <mat-icon aria-hidden="true">{{ tile.icon }}</mat-icon>
        </span>
        <h2 class="dash__tile-title">{{ tile.title | translate }}</h2>
        <p class="dash__tile-text">{{ tile.description | translate }}</p>
        <span class="dash__tile-cta">
          {{ "adminDashboard.accessButton" | translate }}
          <mat-icon aria-hidden="true">arrow_forward</mat-icon>
        </span>
      </a>
    }
  </div>
</div>
