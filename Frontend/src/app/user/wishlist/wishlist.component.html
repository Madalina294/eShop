<div class="page wishlist">
  <app-page-header
    icon="favorite"
    [title]="'wishlist.title' | translate"
    [subtitle]="state() === 'ready' ? itemsLabel() : ('wishlist.subtitle' | translate)"
  />

  @switch (state()) {
    @case ("loading") {
      <app-loading-state variant="grid" [count]="4" [label]="'wishlist.loading' | translate" />
    }

    @case ("error") {
      <app-error-state
        [title]="'errors.loadFailedTitle' | translate"
        [description]="'errors.loadFailedDescription' | translate"
        [retryLabel]="'common.retry' | translate"
        (retry)="load()"
      />
    }

    @case ("empty") {
      <app-empty-state
        icon="favorite_border"
        [title]="'wishlist.empty.title' | translate"
        [description]="'wishlist.empty.message' | translate"
      >
        <a mat-flat-button color="primary" routerLink="/user/all-products">
          <mat-icon>storefront</mat-icon>
          {{ "wishlist.empty.browseProducts" | translate }}
        </a>
      </app-empty-state>
    }

    @default {
      <ul class="wishlist__grid">
        @for (entry of entries(); track entry.product.id; let i = $index) {
          <li>
            <!-- The filled heart removes; the catalogue card uses the same
                 control to add, so the gesture stays consistent. -->
            <app-product-card
              [product]="entry.product"
              [link]="['/user/view-product']"
              [linkQueryParams]="{ id: entry.product.id }"
              [footnote]="footnote(entry)"
              [eager]="i < 4"
              [showAddToCart]="true"
              [showWishlist]="true"
              [inWishlist]="true"
              (addToCart)="openQuantityDialog($event)"
              (toggleWishlist)="remove($event)"
            />
          </li>
        }
      </ul>
    }
  }
</div>
