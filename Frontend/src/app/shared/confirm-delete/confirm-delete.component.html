<h2 mat-dialog-title class="confirm__title">
  <mat-icon
    class="confirm__icon"
    [class.is-destructive]="destructive"
    aria-hidden="true"
  >{{ icon }}</mat-icon>
  {{ titleKey | translate }}
</h2>

<mat-dialog-content>
  <p class="confirm__message">{{ data.message }}</p>
</mat-dialog-content>

<mat-dialog-actions align="end">
  <button mat-button type="button" (click)="dialogRef.close(false)">
    {{ cancelKey | translate }}
  </button>

  <button
    mat-flat-button
    type="button"
    class="confirm__confirm-btn"
    [class.is-destructive]="destructive"
    [color]="destructive ? undefined : 'primary'"
    cdkFocusInitial
    (click)="dialogRef.close(true)"
  >
    {{ confirmKey | translate }}
  </button>
</mat-dialog-actions>
