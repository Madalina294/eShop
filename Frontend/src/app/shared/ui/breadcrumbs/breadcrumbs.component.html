<nav class="crumbs" [attr.aria-label]="'breadcrumb.title' | translate">
  <ol class="crumbs__list">
    @for (crumb of items(); track crumb.label; let last = $last) {
      <li class="crumbs__item">
        @if (crumb.link && !last) {
          <a
            class="crumbs__link"
            [routerLink]="crumb.link"
            [queryParams]="crumb.queryParams ?? null"
          >
            {{ crumb.label }}
          </a>
        } @else {
          <span class="crumbs__current" [attr.aria-current]="last ? 'page' : null">
            {{ crumb.label }}
          </span>
        }

        @if (!last) {
          <mat-icon class="crumbs__sep" aria-hidden="true">chevron_right</mat-icon>
        }
      </li>
    }
  </ol>
</nav>
